name: Check

# Linux-first CI authority. Windows validation and Windows desktop packaging
# are deferred and are not merge gates. Platform policy:
# docs/future/atoms/README.md

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      smoke-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yuvi_smoke
          POSTGRES_PASSWORD: yuvi_smoke_ci
          POSTGRES_DB: yuvi_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuvi_smoke -d yuvi_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # postinstall builds apps/web/vendor/cubism-framework/dist from vendored TS
        # (root .gitignore ignores dist/; Cubism Core is never committed).

      - name: Ensure Cubism Framework dist
        run: pnpm prepare:cubism-framework

      - name: Install Linux desktop build dependencies
        run: |
          # Chrome is not a build dependency; its runner image mirror can be inconsistent.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libsecret-1-dev

      - name: Tauri shell tests
        run: cargo test --locked --lib --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Retrieval evaluation attribution contract
        run: python3 -m unittest discover -s docs/research/compositional-retrieval/experiments -p 'grading_test.py'

      - name: Smoke
        env:
          DATABASE_URL: postgres://yuvi_smoke:yuvi_smoke_ci@127.0.0.1:5432/yuvi_smoke
          MEMORY_REPOSITORY: postgres
          DEFAULT_EMBEDDING_PROVIDER: mock
          PROVIDER_ALLOW_MOCKS: "true"
        run: |
          pnpm db:migrate
          pnpm smoke

      - name: Normal Character startup, R5 PostgreSQL invariants and product routes
        env:
          DATABASE_URL: postgres://yuvi_smoke:yuvi_smoke_ci@127.0.0.1:5432/yuvi_smoke
          YUVI_MEMORY_R5_TEST_DATABASE_URL: postgres://yuvi_smoke:yuvi_smoke_ci@127.0.0.1:5432/yuvi_smoke
          YUVI_PRODUCTION_PATH_TEST_DATABASE_URL: postgres://yuvi_smoke:yuvi_smoke_ci@127.0.0.1:5432/yuvi_smoke
          YUVI_PRODUCTION_PATH_EVIDENCE_DIRECTORY: ${{ runner.temp }}/yuvi-production-path
        run: |
          pnpm --filter @companion/memory exec vitest run src/authority/authority.integration.test.ts src/authority/retrieval-quality.integration.test.ts src/authority/compositional-retrieval.integration.test.ts src/authority/legacy-workflow.integration.test.ts src/authority/database-contract.integration.test.ts src/migrations-ledger.integration.test.ts src/finalized-ingestion-ledger.test.ts src/finalized-ingestion-executor.test.ts
          pnpm --filter @companion/server exec vitest run src/production-reality-entry.integration.test.ts src/evidence-continuity-entry.integration.test.ts src/observation-atomic.integration.test.ts src/routes/memory-knowledge.integration.test.ts src/conversation-host-identity.integration.test.ts src/memory-authority-lifecycle.integration.test.ts src/memory-sibling-convergence.integration.test.ts

      - name: Archive normal startup model input summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-path-${{ github.sha }}
          path: ${{ runner.temp }}/yuvi-production-path
          retention-days: 7
