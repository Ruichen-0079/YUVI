name: Check

# Linux-first CI authority. Windows validation and Windows desktop packaging
# are deferred and are not merge gates. Platform policy:
# docs/future/atoms/README.md

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      smoke-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: yuvi_smoke
          POSTGRES_PASSWORD: yuvi_smoke_ci
          POSTGRES_DB: yuvi_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuvi_smoke -d yuvi_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # postinstall builds apps/web/vendor/cubism-framework/dist from vendored TS
        # (root .gitignore ignores dist/; Cubism Core is never committed).

      - name: Ensure Cubism Framework dist
        run: pnpm prepare:cubism-framework

      - name: Install Linux desktop build dependencies
        run: |
          # Chrome is not a build dependency; its runner image mirror can be inconsistent.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libsecret-1-dev

      - name: Tauri shell tests
        run: cargo test --locked --lib --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Smoke
        env:
          DATABASE_URL: postgres://yuvi_smoke:yuvi_smoke_ci@127.0.0.1:5432/yuvi_smoke
          MEMORY_REPOSITORY: postgres
          DEFAULT_EMBEDDING_PROVIDER: mock
          PROVIDER_ALLOW_MOCKS: "true"
        run: |
          pnpm db:migrate
          pnpm smoke
